[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gnn-cyber-project"
version = "0.1.0"
description = "GNN-based Cyber Threat Prediction System using Graph Neural Networks for network intrusion detection"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Mohamed salem eddah", email = "your.email@example.com"}
]
maintainers = [
    {name = "Mohamed salem eddah", email = "your.email@example.com"}
]
keywords = [
    "graph-neural-networks",
    "cybersecurity",
    "intrusion-detection",
    "machine-learning",
    "pytorch",
    "pytorch-geometric"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Security",
]

dependencies = [
    # Core Dependencies
    "torch>=2.0.0",
    "torch-geometric>=2.3.0",
    "pyg-lib>=0.2.0",
    "torch-scatter>=2.1.0",
    "torch-sparse>=0.6.0",
    "torch-cluster>=1.6.0",
    "torch-spline-conv>=1.2.0",

    # Data Processing
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "scikit-learn>=1.3.0",
    "pyarrow>=12.0.0",  # For Parquet support
    "fastparquet>=2023.0.0",

    # Graph Processing
    "networkx>=3.0",

    # Visualization
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "pyvis>=0.3.2",

    # Utilities
    "tqdm>=4.65.0",
    "pyyaml>=6.0",
    "python-dateutil>=2.8.2",
    "python-dotenv>=1.0.0",  # Environment variable management
    "pydantic>=2.0.0",  # Data validation
    "pydantic-settings>=2.0.0",

    # API & Production
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.23.0",
    "aiofiles>=23.0.0",

    # Monitoring
    "prometheus-client>=0.17.0",

    # Logging
    "loguru>=0.7.0",
    "python-json-logger>=2.0.0",

    # Performance
    "joblib>=1.3.0",
    "lz4>=4.3.0",

    # MLOps
    "mlflow>=2.5.0",
]

[project.optional-dependencies]
dev = [
    # Testing
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.21.0",
    "pytest-mock>=3.11.0",
    "pytest-xdist>=3.3.0",  # Parallel test execution
    "hypothesis>=6.82.0",  # Property-based testing

    # Code Quality
    "black>=23.0.0",
    "flake8>=6.0.0",
    "mypy>=1.4.0",
    "isort>=5.12.0",
    "pylint>=2.17.0",
    "bandit>=1.7.5",  # Security linting

    # Pre-commit
    "pre-commit>=3.3.0",

    # Documentation
    "sphinx>=7.0.0",
    "sphinx-rtd-theme>=1.2.0",
    "sphinx-autodoc-typehints>=1.23.0",
]

jupyter = [
    "jupyter>=1.0.0",
    "jupyterlab>=4.0.0",
    "ipykernel>=6.25.0",
    "ipywidgets>=8.0.0",
]

gpu = [
    # GPU-specific packages
    "tensorboard>=2.13.0",
]

all = [
    "gnn-cyber-project[dev,jupyter,gpu]",
]

[project.urls]
Homepage = "https://github.com/ze3tar/gnn-cyber-project"
Repository = "https://github.com/ze3tar/gnn-cyber-project"
"Bug Tracker" = "https://github.com/ze3tar/gnn-cyber-project/issues"

[project.scripts]
gnn-cyber = "main_pipeline:main"
gnn-train = "src.training.trainer:main"
gnn-serve = "src.api.serve:main"

[tool.setuptools]
packages = ["src", "src.preprocessing", "src.models", "src.training", "src.api", "src.utils"]

[tool.setuptools.package-data]
src = ["py.typed"]

# =============================================================================
# Testing Configuration
# =============================================================================
[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--cov=src",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-report=xml",
    "--cov-branch",
    "-v",
    "-ra",
    "--tb=short",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
    "gpu: marks tests that require GPU",
]
filterwarnings = [
    "error",
    "ignore::UserWarning",
    "ignore::DeprecationWarning",
]

# =============================================================================
# Coverage Configuration
# =============================================================================
[tool.coverage.run]
source = ["src"]
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/__init__.py",
    "*/conftest.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]

# =============================================================================
# Black Configuration
# =============================================================================
[tool.black]
line-length = 100
target-version = ["py311"]
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

# =============================================================================
# isort Configuration
# =============================================================================
[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
split_on_trailing_comma = true

# =============================================================================
# mypy Configuration
# =============================================================================
[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
follow_imports = "normal"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "torch_geometric.*",
    "networkx.*",
    "sklearn.*",
    "seaborn.*",
]
ignore_missing_imports = true

# =============================================================================
# pylint Configuration
# =============================================================================
[tool.pylint.messages_control]
disable = [
    "C0111",  # missing-docstring
    "C0103",  # invalid-name
    "R0913",  # too-many-arguments
    "R0914",  # too-many-locals
    "W0212",  # protected-access
]

[tool.pylint.format]
max-line-length = 100

# =============================================================================
# Bandit Configuration (Security Linting)
# =============================================================================
[tool.bandit]
exclude_dirs = ["tests", "test_*"]
skips = ["B101", "B601"]
